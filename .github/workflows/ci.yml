name: .NET CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore BackendAPI/BackendAPI.sln

    - name: Build
      run: dotnet build BackendAPI/BackendAPI.sln --no-restore

    - name: Test
      run: dotnet test BackendAPI/BackendAPI.sln --no-build --verbosity normal